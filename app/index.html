      }

    <!-- GitHub Pages SPA routing: decode the ?p= redirect from 404.html -->
    <script>
      (function(l) {
        if (l.search[1] === '/' || (l.search.indexOf('?p=/') === 0)) {
          var params = l.search.slice(1).split('&');
          var path = '';
          var query = '';
          for (var i = 0; i < params.length; i++) {
            if (params[i].slice(0, 2) === 'p=') {
              path = params[i].slice(2).replace(/~and~/g, '&');
            } else if (params[i].slice(0, 2) === 'q=') {
              query = '?' + params[i].slice(2).replace(/~and~/g, '&');
            }
          }
          if (path) {
            window.history.replaceState(null, null, l.pathname.slice(0, -1) + path + query + l.hash);
          }
        }
      }(window.location))
    </script>
